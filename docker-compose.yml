services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etosema
      POSTGRES_PASSWORD: etosema_password
      POSTGRES_DB: etosema_db
    ports:
      # Best practice: don't expose DB publicly. Override if needed.
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etosema -d etosema_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./compose.env
    ports:
      # Nginx on the host proxies to localhost:3001
      - "${APP_BIND_ADDR:-127.0.0.1}:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/prisma:/app/backend/prisma

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Build-time public API URL (Next.js inlines NEXT_PUBLIC_* at build)
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    env_file:
      - ./compose.env
    environment:
      # Don't leak backend PORT into Next.js runtime (Next uses PORT to bind).
      - PORT=3000
    depends_on:
      - backend
    ports:
      # Nginx on the host proxies to localhost:3000
      - "${APP_BIND_ADDR:-127.0.0.1}:3000:3000"

volumes:
  postgres_data:
